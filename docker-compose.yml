services:
  backend:
    build:
      context: ./backend
    container_name: simple-calculator-backend
    restart: unless-stopped
    expose:
      - "8000"

  frontend:
    build:
      context: .
    container_name: simple-calculator-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
